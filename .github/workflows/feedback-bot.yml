name: Feedback Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: Restore state cache
        id: cache-state
        uses: actions/cache@v5
        with:
          path: tools/feedback-bot-state.json
          key: feedback-bot-state-${{ github.run_id }}
          restore-keys: |
            feedback-bot-state-

      - name: Run feedback bot
        shell: pwsh
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MEOW_NICKNAME: isczjk
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: 137458/tieba-lite-harmony
        run: |
          pwsh -NoProfile -File tools/feedback-bot.ps1 -StateFile tools/feedback-bot-state.json

      - name: Save state cache
        uses: actions/cache@v5
        with:
          path: tools/feedback-bot-state.json
          key: feedback-bot-state-${{ github.run_id }}